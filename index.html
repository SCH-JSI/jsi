<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A growing shelf of useful tools, experiments, and ideas from JSI." />
    <meta property="og:title" content="JSI · S&amp;C Holdings" />
    <meta property="og:description" content="A growing shelf of useful tools, experiments, and ideas from JSI." />
    <meta property="og:image" content="https://sch-jsi.github.io/jsi/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JSI · S&amp;C Holdings" />
    <meta name="twitter:description" content="A growing shelf of useful tools, experiments, and ideas from JSI." />
    <meta name="twitter:image" content="https://sch-jsi.github.io/jsi/og.png" />
    <title>JSI · S&amp;C Holdings</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="assets/app.js" defer></script>
  </head>
  <body>
    <main class="shelf-home">
      <header class="shelf-masthead">
        <a class="logo-lockup" href="#shelf" aria-label="JSI, an S and C Holdings studio">
          <img src="assets/jsi-logo.png" alt="S and C Holdings and JSI" />
        </a>
      </header>

      <section class="library-room" id="shelf" aria-label="JSI project bookshelf">
        <h1 class="visually-hidden">JSI project shelf</h1>
        <div class="wall-glow glow-one" aria-hidden="true"></div>
        <div class="wall-glow glow-two" aria-hidden="true"></div>
        <div class="cryptic-window" aria-hidden="true">
          <span class="window-sun"></span>
          <span class="window-step step-a"></span>
          <span class="window-step step-b"></span>
          <span class="window-step step-c"></span>
        </div>

        <div class="bookcase">
          <div class="case-crown" aria-hidden="true"><span></span><i></i></div>

          <div class="shelf-level shelf-level-top">
            <div class="decor-bay plant-bay" aria-hidden="true">
              <div class="shelf-plant">
                <div class="plant-leaves"><i></i><i></i><i></i><i></i><i></i><i></i></div>
                <div class="plant-pot"><span></span></div>
              </div>
            </div>

            <div class="book-bay">
              <div class="shelf-book book-coral" aria-hidden="true"><span>Field notes</span></div>
              <div class="shelf-book book-lime book-short" aria-hidden="true"><span>Small systems</span></div>
              <div id="project-grid" class="project-books" aria-live="polite"></div>
              <div class="shelf-book book-ink book-lean" aria-hidden="true"><span>Useful oddities</span></div>
              <div class="shelf-book book-cobalt" aria-hidden="true"><span>Experiments</span></div>
            </div>

            <div class="decor-bay terrarium-bay" aria-hidden="true">
              <div class="terrarium">
                <div class="terrarium-lid"></div>
                <div class="terrarium-glass">
                  <span class="moss moss-one"></span><span class="moss moss-two"></span>
                  <span class="tiny-fern"><i></i><i></i><i></i></span><span class="terrarium-soil"></span>
                </div>
              </div>
            </div>
          </div>

          <div class="timber-shelf" aria-hidden="true"><span></span></div>

          <div class="shelf-level shelf-level-lower">
            <div class="decor-bay illusion-bay" aria-hidden="true">
              <div class="impossible-object">
                <div class="impossible-frame"><span></span><span></span><span></span><span></span></div>
                <div class="floating-stairs"><i></i><i></i><i></i><i></i><i></i></div>
                <div class="impossible-moon"></div>
              </div>
            </div>

            <div class="horizontal-stack" aria-hidden="true">
              <span class="stack-book stack-blue"></span><span class="stack-book stack-red"></span><span class="stack-book stack-cream"></span>
              <div class="orb"><i></i></div>
            </div>

            <div class="decor-bay aquarium-bay" aria-label="A tiny decorative aquarium">
              <div class="aquarium" aria-hidden="true">
                <span class="waterline"></span>
                <span class="fish fish-one"></span><span class="fish fish-two"></span>
                <span class="bubble bubble-one"></span><span class="bubble bubble-two"></span><span class="bubble bubble-three"></span>
                <span class="water-plant"><i></i><i></i><i></i></span><span class="gravel"></span>
              </div>
            </div>
          </div>

          <div class="timber-shelf timber-shelf-base" aria-hidden="true"><span></span></div>
          <div class="cabinet-feet" aria-hidden="true"><i></i><i></i></div>
        </div>

        <footer class="maker-plaque">
          <span>JSI · S&amp;C Holdings</span>
          <a href="https://pages.github.com/" rel="noreferrer">GitHub Pages ↗</a>
        </footer>
      </section>
    </main>
  </body>
</html>
