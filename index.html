<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="JSI is S&amp;C Holdings' public shelf for experiments, useful tools, and odd ideas." />
    <meta property="og:title" content="JSI · S&amp;C Holdings" />
    <meta property="og:description" content="JSI is S&amp;C Holdings' public shelf for experiments, useful tools, and odd ideas." />
    <meta property="og:image" content="og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JSI · S&amp;C Holdings" />
    <meta name="twitter:description" content="JSI is S&amp;C Holdings' public shelf for experiments, useful tools, and odd ideas." />
    <meta name="twitter:image" content="og.png" />
    <title>JSI · S&amp;C Holdings</title>
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="assets/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <a class="brand" href="./" aria-label="JSI home">
          <span class="brand-mark" aria-hidden="true">JSI</span>
          <span>S&amp;C Holdings / JSI</span>
        </a>
      </header>

      <main>
        <section class="catalogue" aria-labelledby="catalogue-title">
          <div class="catalogue-head">
            <h1 id="catalogue-title">Projects</h1>
            <p id="project-count" class="count" aria-live="polite">Loading…</p>
          </div>

          <label class="search">
            <span class="search-label">Find something</span>
            <span class="search-row">
              <span aria-hidden="true">⌕</span>
              <input id="search-input" type="search" placeholder="Search projects, pages, or tags" autocomplete="off" />
              <kbd>/</kbd>
            </span>
          </label>

          <div id="project-grid" class="project-grid" aria-live="polite"></div>
          <div id="empty-state" class="empty-state" hidden>
            <p id="empty-message">Nothing on the shelf matches that yet.</p>
            <button id="clear-search" type="button">Clear the search</button>
          </div>
          <noscript>This page needs JavaScript to load the project shelf.</noscript>
        </section>
      </main>

      <footer>
        <span>JSI is part of S&amp;C Holdings.</span>
        <a href="https://pages.github.com/" rel="noreferrer">Published with GitHub Pages ↗</a>
      </footer>
    </div>
  </body>
</html>
